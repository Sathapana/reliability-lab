[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reliability-lab"
dynamic = ["version"]
description = "Study-design library for the reliability of LLM and human judgments, built on Krippendorff's alpha."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sathapana Chawananon" }]
keywords = [
    "krippendorff",
    "alpha",
    "inter-rater reliability",
    "annotation",
    "llm-as-a-judge",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.15",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.4"]
parquet = ["pyarrow>=15"]

[project.urls]
Repository = "https://github.com/Sathapana/reliability-lab"
Issues = "https://github.com/Sathapana/reliability-lab/issues"
Changelog = "https://github.com/Sathapana/reliability-lab/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    # Exercise the optional extras in tests; they stay optional at runtime.
    "scikit-learn>=1.4",
    "pyarrow>=15",
]
# Reference implementations used only by the parity tests. `krippendorff` is
# GPL-licensed, so it must never become a runtime dependency. `irrCAC` is not
# listed: it pins scipy==1.12.0, which would hold the whole lock at numpy 1.x.
# Its parity test runs in an isolated environment (see the CI workflow).
parity = [
    "krippendorff>=0.8",
    "nltk>=3.8",
    "evalica>=0.3",
]
# Figures for the coverage-simulation guidance (simulations/report.py).
sim = [
    "matplotlib>=3.8",
]

[tool.uv]
default-groups = ["dev", "parity"]

[tool.hatch.version]
path = "src/reliability_lab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# The design record is kept verbatim, including its code sketches.
exclude = ["docs/design/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import the simulations harness.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
    "parity: compares against third-party reference implementations (test-only dependencies)",
]
